# A ogni push su main che tocca il sito o l'app: compila il sito, lo mette dentro l'APK
# e pubblica una GitHub Release con BiteRanks.apk + version.json.
# L'app installata legge version.json all'avvio e propone l'aggiornamento.
name: App Android

on:
  push:
    branches: [main]
    paths:
      - 'vite-project/**'
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      TAG: app-v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vite-project/package-lock.json

      - name: Build del sito
        working-directory: vite-project
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Mancano i secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (vedi android/README.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: biteranks
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PversionCode="$VERSION_CODE" --no-daemon

      - name: Prepara i file della release
        env:
          REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/BiteRanks.apk
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/$REPO/releases/download/$TAG/BiteRanks.apk" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl}' > out/version.json
          printf '%s\n' "${COMMIT_MESSAGE:-Build manuale}" > out/notes.md

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # se si rilancia lo stesso run la release esiste già: la si ricrea
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" out/BiteRanks.apk out/version.json \
            --title "BiteRanks Android $VERSION_NAME" \
            --notes-file out/notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - name: Tieni solo le ultime 5 release dell'app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("app-v"))) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --cleanup-tag --yes
          done
